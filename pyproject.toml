[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiligaynon-ai-lexicon"
version = "0.1.0"
description = "NLP toolkit and API for a Hiligaynon lexical database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kurshan Craig Sandler L. Casilen" }]
dependencies = [
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
hiligaynon-clean = "hiligaynon_lexicon.clean:main"
hiligaynon-db = "hiligaynon_lexicon.db:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
